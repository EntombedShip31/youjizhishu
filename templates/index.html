<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游迹智述·欢迎您</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-background">
            <div class="bg-shapes"></div>
            <div class="bg-overlay"></div>
            <canvas id="loginParticleCanvas" class="particle-canvas"></canvas>
        </div>
        
        <div class="auth-content">
            <div class="brand-section">
                <div class="logo-container">
                    <img src="../assets/img/logo.png" alt="游迹智述" class="brand-logo-img">
                    <h1 class="brand-name">游迹智述</h1>
                </div>
                <p class="brand-slogan">探索世界的每一个角落</p>
                <div class="feature-list">
                    <div class="feature-item">
                        <i class="fas fa-map-marked-alt"></i>
                        <span>智能导览，深度讲解</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-route"></i>
                        <span>个性化行程规划</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-users"></i>
                        <span>旅行社区，分享体验</span>
                    </div>
                </div>
            </div>

            <div class="auth-box">
                <div class="auth-header">
                    <div class="auth-tabs">
                        <button class="tab-btn active" data-tab="login">登录</button>
                        <button class="tab-btn" data-tab="register">注册</button>
                    </div>
                </div>

                <!-- 登录表单 -->
                <form id="loginForm" class="auth-form active">
                    <div class="form-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="用户名/手机号/邮箱" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="密码" required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" checked>
                            <span>记住我</span>
                        </label>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">登录</button>
                    <div class="social-login">
                        <p>其他登录方式</p>
                        <div class="social-icons">
                            <a href="#" class="social-icon wechat">
                                <i class="fab fa-weixin"></i>
                            </a>
                            <a href="#" class="social-icon qq">
                                <i class="fab fa-qq"></i>
                            </a>
                            <a href="#" class="social-icon weibo">
                                <i class="fab fa-weibo"></i>
                            </a>
                        </div>
                    </div>
                </form>

                <!-- 注册表单 -->
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="设置用户名" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-mobile-alt"></i>
                        <input type="tel" placeholder="手机号码" required>
                        <button type="button" class="send-code">获取验证码</button>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-key"></i>
                        <input type="text" placeholder="短信验证码" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="设置密码" required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="确认密码" required>
                    </div>
                    <div class="form-options">
                        <label class="agree-terms">
                            <input type="checkbox" required>
                            <span>我已阅读并同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a></span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">注册</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../assets/js/login.js"></script>
</body>
</html>
